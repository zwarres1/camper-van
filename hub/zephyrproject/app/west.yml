manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: microchip
      url-base: https://github.com/Zephyr4Microchip

  projects:
    - name: zephyr
      remote: microchip        # <-- Pull from Zephyr4Microchip
      repo-path: zephyr        # <-- Specifically pull the Zephyr OS repo
      revision: main           # <-- You can lock this to a specific commit hash later
      import: true

  self:
    path: app