CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y
CONFIG_SPI=y

# --- ZEPHYR SYSTEM HEAP & STACK ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# --- LVGL CORE ---
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_44=y
CONFIG_LV_USE_SPAN=n
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# --- LVGL ZEPHYR ABSTRACTION OVERRIDES ---
CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y
CONFIG_LV_USE_DRAW_EVE=y
CONFIG_LV_Z_AUTO_INIT=n