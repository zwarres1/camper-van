CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LVGL=y
CONFIG_LV_USE_DRAW_EVE=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_44=y

# Enable the Dummy Display driver to satisfy the build system
CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y

# Tell Zephyr's LVGL wrapper to back off and let you handle initialization manually
CONFIG_LV_Z_AUTO_INIT=n