CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LVGL=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_44=y

# Enable the Dummy Display driver to satisfy the build system
CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y

CONFIG_LV_COLOR_DEPTH_16=y

CONFIG_LV_Z_MEM_POOL_SIZE=0

CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_USE_SPAN=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC=y

# 3. Tell LVGL to use standard C library malloc() instead
#CONFIG_LV_USE_STDLIB_MALLOC=y

# Give LVGL enough memory to draw complex widgets (16KB minimum, scale up if needed)
CONFIG_HEAP_MEM_POOL_SIZE=32768

# 4. Tell LVGL to allocate a static 64KB array in RAM to act as its heap
CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_LV_USE_DRAW_EVE=y